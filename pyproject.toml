[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelbench-expanded"
version = "0.2.0a1"
description = "A research-oriented expansion of PixelBench with complementary colour, palette and edge-quality metrics."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Astropulse, LLC" }]
maintainers = [{ name = "Black Magik" }]
keywords = ["pixel-art", "benchmark", "downscaling", "depixelization", "reconstruction"]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "opencv-python>=4.5",
    "Pillow>=9.0",
    "scikit-image>=0.20",
]

[project.optional-dependencies]
# Adapters for third-party reconstruction methods. Install what you want to
# benchmark; missing ones are skipped automatically.
unfake = ["unfake>=1.0"]
pixelfixer = ["pixelfixer>=0.1"]
report = ["matplotlib>=3.5"]
all = ["unfake>=1.0", "pixelfixer>=0.1", "matplotlib>=3.5"]

[project.scripts]
pixelbench = "pixelbench.cli:main"

[tool.setuptools]
packages = ["pixelbench", "pixelbench.distort", "pixelbench.methods", "pixelbench.metrics"]
